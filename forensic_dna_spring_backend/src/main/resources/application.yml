spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000

server:
  port: ${PORT:8000}

springdoc:
  swagger-ui:
    tagsSorter: none
    operationsSorter: none